[package]
name = "nativelite-wayland"
version = "0.1.0"
edition = "2021"
rust-version = "1.70"
description = "A Wayland client - the wire format, the socket with file descriptor passing, objects, events, and a protocol scanner - using only the Rust standard library."
license = "MIT"
repository = "https://github.com/nativelite/wayland-rs"
keywords = ["wayland", "client", "protocol", "scanner", "nativelite"]
categories = ["gui", "os::linux-apis"]

# nativelite core rule: ZERO third-party dependencies. Do not add to this.
[dependencies]

[lib]
name = "wayland"
path = "src/lib.rs"
